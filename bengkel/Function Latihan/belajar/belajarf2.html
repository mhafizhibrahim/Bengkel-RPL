<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengubah Celcius Ke Farenheit Dan Kelvin - Function</title>
</head>
<body>
    
    <label>Celcius : </label>
    <input type="number" id="celcius"><br><br>

    <button type="button" onclick="hitung()">Konversikan</button>
    <button type="button" onclick="lagi()">Input Ulang</button>

    <h3 id="yokui"></h3>

    <script>
        function farenheit(celcius, b, c) {
            let faren = (celcius * b) + c;
            return faren;
        }

        function kelvin(celcius, d) {
            let kel = (celcius + d)
            return kel;
        }

        function reamur(celcius, e) {
            let rea = (celcius * e)
            return rea;
        }

        function hitung() {
            let celcius = Number(document.getElementById("celcius").value);
            let b = 1.8;
            let c = 32;
            let d = 273.15;
            let e = 0.8

            let hasil = farenheit(celcius, b, c);
            let hassilk = kelvin(celcius, d);
            let hasilr = reamur(celcius, e);

            document.getElementById("yokui").innerHTML = 
            "Farenheit : " + hasil.toFixed(2) + "°F" +
            "<br>Kelvin : " + hassilk.toFixed(2) + " K" +
            "<br>Reamur : " + hasilr.toFixed(2) + "°R";
        }

        function lagi() {
            document.getElementById("celcius").value = "";
            document.getElementById("yokui").innerHTML = "";
        }
    </script>
</body>
</html>
