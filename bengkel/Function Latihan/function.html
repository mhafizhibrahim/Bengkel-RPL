<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Latihan Function</title>
</head>
<body>
    
    <script>
        // fungsi default jika nama tidak diisi
        function bilangHai(nama = "Dunia") {
            document.write("<p>Hoi, " + nama + "!</p>");
        }
        //memanggil fungsi
        bilangHai("Habil");
        bilangHai();
    </script>
</body>
</html>
