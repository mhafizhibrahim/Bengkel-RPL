<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Perkalian</title>
</head>
<body>
    
    <script>
        function kali(a, b) {
            // const bisa diubah ke var atau let
            var hasilKali = a * b;
            document.write("Hasil Kali dari " + a + " * " + b + " = " + hasilKali + "<br>");
        }

        //menampilkan
        kali(5, 4);
        kali(9, 4);     
    </script>
</body>
</html>
