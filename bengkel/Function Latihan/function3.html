<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function test</title>
</head>
<body>
    <script>
        function kali(a, b) {
            return a * b;
        }

        function tambah(a, b) {
            return a + b;
        }

        function kurang(a, b) {
            return a - b;
        }

        let a = Number(prompt("Masukan Angka 1"));
        let b = Number(prompt("Masukan Angka 2"));

        let hasil = tambah(a, b);

        document.write("Hasilnya = " + hasil);

        
    </script>
</body>

</html>
