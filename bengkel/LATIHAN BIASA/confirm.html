<!DOCTYPE html>
<html>
    <head>
        <title>Dialog Confirm</title>
    </head>
    <body>
    <script>
        var yakin = confirm("Apa kau yakin mengunjungi situs ini?");

        if (yakin) {
            window.location = "https://www.petanikode.com";
        } else {
            alert("Baiklah, tetap di sini saja ya");
        }
    </script>
    </body>
</html>
