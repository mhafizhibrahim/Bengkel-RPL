<!DOCTYPE html>
<html>
    <head>
        <title>Latihan array</title>
    </head>
    <body>
        <script>
            var produk = ["Bakso Jumbo","Mie ayam", "Mie ayam bakso", "Mie ayam bakso mercon", "Esteh Manis", ];
            
            produk.push("Tisu");
            document.write("<ol>");
                for(let i = 0; i < produk.length; i++){
                    document.write(`<li> ${produk[i]} </li>`);
                }
        </script>
    </body>
</html>
