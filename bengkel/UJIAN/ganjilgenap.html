<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ganjil Genap</title>
</head>

<body>
    <script>

        var bilangan = prompt("Masukan Angka Ganjil Atau Genap");
        var hasil = "";

        if (bilangan %2 == 0) hasil = "Genap";
        else hasil = "Ganjil";


        document.write(`<p>Hasilnya Adalah : ${hasil}`);
    </script>
</body>
</html>
